# polybar CONFIG FILE

# --- COLORS ---
[colors]
background = #282A2E
foreground = #C5C8C6
primary = #8ABEB7
disabled = #707880

# --- BAR VISUAL ---
[bar/main]
width = 100%
height = 14pt
radius = 4px

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 5px
border-top-size = 0
border-color = #00000000

padding = 1

module-margin = 1

separator = 
separator-foreground = ${colors.disabled}

font-0 = Hack Nerd Font:size=10;2

modules-left = battery memory tray
modules-center = xwindow
modules-right = xkeyboard date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

bottom = true

# --- MODULES ---
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 80%

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %layout%

label-indicator-padding = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.primary}

[module/memory]
type = internal/memory
interval = 5

format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/battery]
type = internal/battery

full-at = 95
low-at = 5
poll-interval = 1

format-charging = <animation-charging> <label-charging>
format-discharging = %{F#8ABEB7}<ramp-capacity>%{F-} <label-discharging>

label-charging = %{F#8ABEB7}%percentage%%{F-}%
label-discharging = %percentage%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󱊡
ramp-capacity-2 = 󱊢
ramp-capacity-3 = 󱊣

animation-charging-0 = 󰂎
animation-charging-1 = 󱊡
animation-charging-2 = 󱊢
animation-charging-3 = 󱊣

animation-charging-framerate = 1000

[module/date]
type = internal/date
interval = 1

date = %{F#8ABEB7}%H%{F-}:%{F#8ABEB7}%M%{F-}:%{F#8ABEB7}%S%{F-}
date-alt = %{F#8ABEB7}%d%{F-}-%{F#8ABEB7}%m%{F-}-%{F#8ABEB7}%Y%{F-}

label = %date%

