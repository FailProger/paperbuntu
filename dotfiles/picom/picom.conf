# --- DIM ---
inactive-dim = 0.2;

# --- ANIMATION ---
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 5;

# --- OPACITY ---
inactive-opacity = 0.8;

opacity-rule = [
  "100:class_i = 'dmenu'"
]

# --- CORNER ---
rounded-corners = true
corner-radius = 4

rounded-corners-exclude = [
  "class_g = 'Polybar'"
];

# --- SETTINGS ---
backend = "xrender";
vsync = true;

