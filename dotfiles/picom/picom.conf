# picom CONFIG FILE

# --- SETTINGS ---
backend = "xrender";
vsync = true;

# --- ANIMATION ---
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 5;

# --- OPACITY ---
inactive-opacity = 0.9;

opacity-rule = [
  "100:class_g = 'dmenu'",
  "100:class_g = 'i3lock'",
  "100:role = 'Popup'"
];

# --- CORNER ---
rounded-corners = true;
corner-radius = 4;

rounded-corners-exclude = [
  "class_g = 'Polybar'"
];

